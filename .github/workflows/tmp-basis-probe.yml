name: tmp basis probe
on:
  push:
    branches: [tmp/basis-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests pandas && sudo apt-get install -y -q poppler-utils tesseract-ocr >/dev/null
      - env: {AMS_API_KEY: "${{ secrets.AMS_API_KEY }}"}
        run: python tmp/probe.py
      - run: |
          du -sh pout; ls -la pout pout/acps | head -50
          mkdir -p tmp/out && tar czf tmp/out/basis_raw2.tgz -C pout . && ls -la tmp/out
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tmp/out/basis_raw2.tgz && git commit -m "tmp: basis raw output"
          for i in 1 2 3; do git pull --rebase -q origin tmp/basis-probe && git push origin HEAD:tmp/basis-probe && exit 0; sleep 5; done; exit 1
