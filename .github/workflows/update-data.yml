name: Update Cotton Data

on:
  schedule:
    - cron: '35 20 * 4-12 1'   # NASS Crop Progress posts Mondays 4pm ET
    - cron: '30 13 * 4-12 2'   # Tuesday catch-up (holiday weeks / late loads)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install requests pandas
      
      - name: Fetch and update data
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python update_data.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Update cotton data $(date -u +%Y-%m-%d)" || echo "No changes"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
