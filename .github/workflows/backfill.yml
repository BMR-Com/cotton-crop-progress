name: Backfill (parallel, manual)
on:
  workflow_dispatch:
    inputs:
      what: {description: 'nass, fsa, classing or both', default: 'both'}
permissions:
  contents: write
jobs:
  nass:
    if: inputs.what == 'nass' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas
      - env: {USDA_API_KEY: "${{ secrets.USDA_API_KEY }}"}
        run: timeout 105m python scripts/fetch_ginning.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ginning; git commit -m "Backfill NASS ginnings/annual" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  fsa:
    if: inputs.what == 'fsa' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas openpyxl xlrd python-calamine
      - run: timeout 50m python scripts/fetch_fsa.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fsa; git commit -m "Backfill FSA acreage" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  classing:
    if: inputs.what == 'classing' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas
      - env: {AMS_API_KEY: "${{ secrets.AMS_API_KEY }}"}
        run: timeout 170m python scripts/fetch_classing.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/classing; git commit -m "Backfill AMS classing" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
