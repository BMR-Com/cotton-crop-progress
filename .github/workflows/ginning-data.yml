name: Ginnings, classing and FSA acreage
on:
  schedule:
    - cron: '20 17 * 8-12,1-5 1-5'   # weekdays after NASS noon-ET releases, Aug–May
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: data-commit, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas openpyxl xlrd
      - name: NASS ginnings + annual acreage (batched under the 50k limit)
        env: {USDA_API_KEY: "${{ secrets.USDA_API_KEY }}"}
        run: python scripts/fetch_ginning.py
      - name: AMS classing (weekly quality by state)
        env: {AMS_API_KEY: "${{ secrets.AMS_API_KEY }}"}
        run: python scripts/fetch_classing.py
      - name: FSA crop acreage
        run: python scripts/fetch_fsa.py || echo "FSA fetch failed; continuing"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ginning data/fsa data/classing
          git commit -m "Update ginnings / classing / FSA acreage $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase -q origin main && git push
