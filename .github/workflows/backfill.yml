name: Backfill (parallel, manual)
on:
  workflow_dispatch:
    inputs:
      what: {description: 'nass, fsa, classing, office, ginesmis, rma or both', default: 'both'}
      gin_first_year: {description: 'first crop year for NASS ginnings', default: '2014'}
permissions:
  contents: write
jobs:
  nass:
    if: inputs.what == 'nass' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas
      - env: {USDA_API_KEY: "${{ secrets.USDA_API_KEY }}", GIN_FIRST_YEAR: "${{ inputs.gin_first_year }}"}
        run: timeout 105m python scripts/fetch_ginning.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ginning; git commit -m "Backfill NASS ginnings/annual" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  fsa:
    if: inputs.what == 'fsa' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas openpyxl xlrd python-calamine
      - run: timeout 50m python scripts/fetch_fsa.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fsa; git commit -m "Backfill FSA acreage" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  classing:
    if: inputs.what == 'classing' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas
      - env: {AMS_API_KEY: "${{ secrets.AMS_API_KEY }}"}
        run: timeout 170m python scripts/fetch_classing.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/classing; git commit -m "Backfill AMS classing" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  office:
    if: inputs.what == 'office'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas pdfplumber
      - env: {OFFICE_MODE: backfill, OFFICE_REPARSE: "1", OFFICE_FIRST_YEAR: "${{ inputs.gin_first_year }}"}
        run: timeout 110m python scripts/fetch_classing_office.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/classing/office.csv data/classing/office_processed.txt; git commit -m "Backfill classing by office" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  ginesmis:
    if: inputs.what == 'ginesmis'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas
      - env: {GIN_ESMIS_FIRST: "${{ inputs.gin_first_year }}"}
        run: timeout 80m python scripts/fetch_ginnings_esmis.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ginning/ginnings_esmis.csv data/ginning/esmis_processed.txt; git commit -m "Backfill NASS ginnings from ESMIS reports" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
  rma:
    if: inputs.what == 'rma'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas
      - run: timeout 85m python scripts/fetch_rma_col.py || echo "partial"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rma; git commit -m "Backfill RMA cotton cause of loss" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 15; done
